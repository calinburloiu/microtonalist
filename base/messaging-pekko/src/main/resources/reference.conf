microtonalist.messaging {
  # A pinned mailbox gets a thread of its own, which it keeps while idle, so that its name and priority stay.
  pinned-dispatcher {
    type = PinnedDispatcher
    executor = thread-pool-executor
    thread-pool-executor.allow-core-timeout = off
  }

  # The UI mailbox runs on the thread of the executor named here, one message at a time; the app sets its toolkit's.
  ui-dispatcher {
    type = Dispatcher
    executor = "org.calinburloiu.music.microtonalist.messaging.pekko.SingleThreadExecutorConfigurator"
    throughput = 1
  }

  # Control-aware, so that an Urgent message, sent as a ControlMessage, overtakes the ones queued.
  mailbox.mailbox-type = "org.apache.pekko.dispatch.UnboundedControlAwareMailbox"
}

pekko {
  # Pekko logs through SLF4J, hence through logback, like the rest of the app.
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
}
