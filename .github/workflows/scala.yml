# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Run tests with coverage
      run: sbt coverageCheck

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'sbt'
        # A cache key of its own: besides the library dependencies, this job downloads scalafmt and scalafix, and the
        # `build` job downloads scoverage instead, so under a shared key the first job to save its cache would leave the
        # other without its own tools.
        cache-dependency-path: |
          build.sbt
          project/*.scala
          project/build.properties
          project/plugins.sbt
          .scalafmt.conf
    - uses: sbt/setup-sbt@v1
    - name: Check compiler warnings, scalafix rules and formatting
      run: sbt lint

  license-headers:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Install addlicense
      run: go install github.com/google/addlicense@latest
    - name: Check license headers
      run: |
        git ls-files \
          '*.scala' '*.java' '*.py' '*.sh' '*.bash' \
          '*.html' '*.xml' '*.js' '*.css' '*.sbt' '*.properties' \
          | xargs "$(go env GOPATH)/bin/addlicense" -check -ignore '**/tests/resources/**' \
              -f .license-header.tmpl -c "Calin-Andrei Burloiu"

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Test the architecture doc size check
      run: python3 -m unittest discover -s .claude/skills/architecture-docs/scripts/tests -p "test_*.py"
    - name: Check the size of the architecture docs
      run: python3 .claude/skills/architecture-docs/scripts/check_arch_doc_size.py --github
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Check that the Mermaid diagrams render
      run: |
        npm install --global @mermaid-js/mermaid-cli@12.0.0
        # Ubuntu's AppArmor profile forbids the Chrome sandbox that mermaid-cli renders in.
        echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
        mkdir -p "$RUNNER_TEMP/mermaid"
        status=0
        while IFS= read -r -d '' file; do
          echo "Rendering the diagrams of $file"
          mmdc --quiet --puppeteerConfigFile "$RUNNER_TEMP/puppeteer.json" \
            --input "$file" --output "$RUNNER_TEMP/mermaid/out.md" || status=1
        done < <(git grep -l -z '```mermaid' -- '*.md' ':!issues/' ':!docs/agent-evals/')
        exit $status
