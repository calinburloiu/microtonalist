<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latency report tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; }
    pre { margin: 0 0 0 1.5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
<h1>Tests of the report's statistics</h1>
<p id="summary">Running…</p>
<ul id="results"></ul>
<script type="module">
  import {
    ALPHA, bootstrapP99Change, drift, formatNs, mannWhitney, MIN_CHANGE_NS, mulberry32, normalCdf
  } from './stats.js';

  const results = [];

  function test(name, body) {
    try {
      body();
      results.push({ name, ok: true });
    } catch (error) {
      results.push({ name, ok: false, error: String(error && error.message || error) });
    }
  }

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  function assertClose(actual, expected, tolerance, message = '') {
    assert(Math.abs(actual - expected) <= tolerance, `${message} expected ${expected} ± ${tolerance}, got ${actual}`);
  }

  function assertEqual(actual, expected, message = '') {
    assert(actual === expected, `${message} expected ${expected}, got ${actual}`);
  }

  /** A histogram of 1%-wide bins, each [lower bound in ns, count]. */
  function histogram(...bins) {
    return { growth: 1.01, bins };
  }

  /** A metric with the given median and p99 in ns, over a histogram. */
  function metric(median, p99, hist) {
    return { name: 'pedal→tuning', median, p99, histogram: hist };
  }

  test('normalCdf is 0.5 at 0', () => assertClose(normalCdf(0), 0.5, 1e-7));
  test('normalCdf is 0.975 at 1.96', () => assertClose(normalCdf(1.96), 0.975, 1e-3));
  test('normalCdf is symmetric', () => assertClose(normalCdf(-1) + normalCdf(1), 1, 1e-7));

  test('mulberry32 repeats with a seed and stays in [0, 1)', () => {
    const first = mulberry32(7), second = mulberry32(7);
    for (let i = 0; i < 100; i++) {
      const value = first();
      assertEqual(value, second());
      assert(value >= 0 && value < 1, `out of range: ${value}`);
    }
  });

  test('Mann-Whitney of [1,2,3] vs [4,5,6]', () => {
    const result = mannWhitney(histogram([1, 1], [2, 1], [3, 1]), histogram([4, 1], [5, 1], [6, 1]));
    assertEqual(result.u, 0, 'U');
    assertClose(result.p, 0.0495, 1e-3, 'p');
  });

  test('Mann-Whitney of identical histograms', () => {
    const hist = histogram([100000, 10], [101000, 30], [102010, 10]);
    assert(mannWhitney(hist, hist).p > 0.9, 'p should be near 1');
  });

  test('Mann-Whitney of separated histograms', () => {
    const result = mannWhitney(histogram([100000, 500]), histogram([200000, 500]));
    assert(result.p < 1e-6, `p should be tiny, got ${result.p}`);
  });

  test('Mann-Whitney with every value tied', () => {
    assertEqual(mannWhitney(histogram([100000, 50]), histogram([100000, 70])).p, 1, 'p');
  });

  test('bootstrap of identical histograms contains 0', () => {
    const hist = histogram([100000, 300], [110000, 600], [120000, 90], [300000, 10]);
    const interval = bootstrapP99Change(hist, hist, { resamples: 500, seed: 1 });
    assert(interval.low <= 0 && interval.high >= 0, `[${interval.low}, ${interval.high}]`);
  });

  test('bootstrap of a moved tail excludes 0', () => {
    // A tail of 5%, so that p99 stays in it in every resample
    const before = histogram([100000, 950], [200000, 50]);
    const after = histogram([100000, 950], [300000, 50]);
    const interval = bootstrapP99Change(before, after, { resamples: 500, seed: 1 });
    assert(interval.low > 0, `[${interval.low}, ${interval.high}]`);
  });

  test('bootstrap repeats with a seed', () => {
    const before = histogram([100000, 900], [150000, 100]);
    const after = histogram([100000, 850], [160000, 150]);
    const first = bootstrapP99Change(before, after, { resamples: 200, seed: 3 });
    const second = bootstrapP99Change(before, after, { resamples: 200, seed: 3 });
    assertEqual(first.low, second.low, 'low');
    assertEqual(first.high, second.high, 'high');
  });

  test('drift is new when the vs run lacks the metric', () => {
    assertEqual(drift(undefined, metric(100000, 120000, histogram([100000, 10]))).status, 'new');
  });

  test('drift is significant for a large shift', () => {
    const before = metric(200000, 210000, histogram([190000, 250], [200000, 500], [210000, 250]));
    const after = metric(400000, 420000, histogram([380000, 250], [400000, 500], [420000, 250]));
    const result = drift(before, after);
    assertEqual(result.status, 'significant');
    assertEqual(result.medianChange, 200000, 'median change');
    assert(result.mw.p < ALPHA, `p ${result.mw.p}`);
  });

  test('drift ignores a significant shift too small to care about', () => {
    const before = metric(200000, 200000, histogram([200000, 500]));
    const after = metric(201000, 201000, histogram([201000, 500]));
    const result = drift(before, after);
    assert(Math.abs(result.medianChange) < MIN_CHANGE_NS, 'the change is below the minimum');
    assert(result.mw.p < ALPHA, `p ${result.mw.p}`);
    assertEqual(result.status, 'not-significant');
  });

  test('formatNs picks a unit', () => {
    assertEqual(formatNs(850), '850 ns');
    assertEqual(formatNs(312345), '312.3 µs');
    assertEqual(formatNs(1250000), '1.25 ms');
  });

  const failed = results.filter(result => !result.ok).length;
  const passed = results.length - failed;
  const list = document.getElementById('results');
  for (const result of results) {
    const item = document.createElement('li');
    item.className = result.ok ? 'pass' : 'fail';
    item.textContent = `${result.ok ? 'PASS' : 'FAIL'} ${result.name}`;
    if (!result.ok) {
      const detail = document.createElement('pre');
      detail.textContent = result.error;
      item.append(detail);
    }
    list.append(item);
  }
  document.getElementById('summary').textContent = `${passed} passed, ${failed} failed`;
  document.title = `${failed ? 'FAIL' : 'PASS'} ${passed}/${results.length}`;
  window.testResults = { passed, failed, results };
</script>
</body>
</html>
