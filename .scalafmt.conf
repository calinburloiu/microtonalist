# scalafmt configuration. It reproduces IntelliJ IDEA's default Scala style, which the code followed before scalafmt
# was adopted, so that adopting it changes as little as possible. See docs/development/build.md#formatting.
version = 3.11.5

runner.dialect = scala3
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  # sbt 1 compiles the build definition with Scala 2.12.
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
  # A package named `project` in a module's sources isn't part of the build definition. When several patterns match a
  # file, scalafmt applies the longest one, so this one wins over the one above.
  "glob:**/src/{main,test}/scala/**/project/*.scala" {
    runner.dialect = scala3
  }
}

maxColumn = 120
indent.main = 2
indent.extendSite = 2
# Indent the continuation lines of `&&` and `||` too, like any other infix operator.
indent.infix.excludeRegex = "^$"

# Keep the line breaks the author wrote, as IntelliJ IDEA does, and only break lines longer than maxColumn.
newlines.source = keep
newlines.configStyle.callSite.prefer = false
newlines.configStyle.defnSite.prefer = false

# Keep several parameters or arguments on a line, instead of one per line.
binPack.defnSite = always
binPack.callSite = always
# Indent the arguments of nested calls opened on one line once, and a single argument like several.
binPack.indentCallSiteOnce = true
binPack.indentCallSiteSingleArg = false

align.preset = none
align.openParenDefnSite = true
align.openParenCallSite = false

danglingParentheses.defnSite = false
danglingParentheses.callSite = false
# Keeps `for (` generators `) yield` on their own lines, as the code writes them. A multi-line `if` or `while`
# condition also gets its parentheses on their own lines.
danglingParentheses.ctrlSite = true

docstrings.style = Asterisk
docstrings.wrap = no
docstrings.forceBlankLineBefore = false
comments.wrap = no

literals.hexDigits = Upper

rewrite.trailingCommas.style = keep
# Brace syntax, as the coding conventions require.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no
