# scalafix configuration: the rules that `sbtn fix` applies (`sbtn lint` doesn't check them yet, see the TODO at its
# alias in build.sbt). See docs/development/linting.md.
# scalafix removes unused imports only. The compiler reports any other unused code, which is fixed by hand, so there's
# no RemoveUnused rule: it would delete a method that only reflection calls, like a Guava @Subscribe handler.
rules = [
  OrganizeImports,
  DisableSyntax,
  NoValInForComprehension,
  RedundantSyntax,
]

# scalafix owns the import layout, so don't run IntelliJ IDEA's Optimize Imports, which lays them out differently. It's
# the layout of the DEFAULT preset, which scalafix recommends: the other packages, one blank line, then the java, javax
# and scala imports, with the imports and the names in braces sorted by ASCII. Two settings differ from the preset.
OrganizeImports {
  # The default, StandardLayout, writes Scala 2 syntax (`_` and `=>`) in the files whose path doesn't contain `scala-3`.
  targetDialect = Scala3
  # Keeps `import a.{B, C}` and merges `import a.B` and `import a.C` into it, rather than the default Explode, which
  # gives each name an import of its own.
  groupedImports = Merge
}

# Its message is fixed by scalafix ("consider using if/else"): the convention shows how to use `boundary` instead, see
# docs/development/coding-conventions.md#no-return.
DisableSyntax.noReturns = true
DisableSyntax.regex = [
  {
    id = todoWithoutIssue
    pattern = "//\\s*TODO(?! #\\d+)"
    message = "A TODO needs an issue number: // TODO #<issue>. See docs/development/coding-conventions.md#todos-have-issue-numbers"
  }
  {
    id = threadSleep
    pattern = "Thread\\.sleep"
    message = "Don't sleep: synchronize with a CountDownLatch or a CompletableFuture. See docs/development/test-conventions.md#no-sleeping-in-tests"
  }
  {
    id = anyFlatSpec
    pattern = "AnyFlatSpec"
    message = "Tests extend AnyWordSpec, not AnyFlatSpec. See docs/development/test-conventions.md#behavior-driven-style"
  }
]
